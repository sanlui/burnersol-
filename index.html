    <!-- Prevent read-only fetch/sendBeacon assignment exceptions from third-party polyfills in sandboxed iframes -->
    <script id="sandbox-polyfill-patch">
      (function() {
        try {
          let currentFetch = window.fetch;
          const defineOn = (obj) => {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                get() { return currentFetch; },
                set(v) { currentFetch = v; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              // Soft catch for descriptor locking
            }
          };
          defineOn(window);
          defineOn(Window.prototype);
          defineOn(globalThis);
          
          if (window.navigator && window.navigator.sendBeacon) {
            let currentSendBeacon = window.navigator.sendBeacon;
            const defineSB = (obj) => {
              if (!obj) return;
              try {
                Object.defineProperty(obj, 'sendBeacon', {
                  get() { return currentSendBeacon; },
                  set(v) { currentSendBeacon = v; },
                  configurable: true,
                  enumerable: true
                });
              } catch (err) {}
            };
            defineSB(window.navigator);
            defineSB(Navigator.prototype);
          }
        } catch (e) {
          console.warn("Could not patch window/globalThis fetch descriptor:", e);
        }
      })();
    </script>
