<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Solana-like clean neon tech gradient -->
    <linearGradient id="solana-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14F195" />
      <stop offset="50%" stop-color="#9945FF" />
      <stop offset="100%" stop-color="#202025" />
    </linearGradient>
    <!-- Flame / Burner combustion gradient -->
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="60%" stop-color="#FF2A5F" />
      <stop offset="100%" stop-color="#1A0D00" />
    </linearGradient>
  </defs>

  <!-- Dark high-contrast hexagonal background node plate -->
  <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="#010102" stroke="url(#solana-grad)" stroke-width="2.5" />

  <!-- Inner active energy field -->
  <polygon points="50,11 84,31 84,69 50,89 16,69 16,31" fill="#030305" opacity="0.85" />

  <!-- BurnerSol Flame Sigil -->
  <path d="M50,18 
           C28,45 28,68 42,82 
           C46,86 54,86 58,82
           C72,68 72,45 50,18 Z" 
        fill="url(#flame-grad)" />

  <!-- Bright Reactor Core Spark (Green Solana Accents) -->
  <path d="M50,42
           C42,55 45,71 50,80
           C55,71 58,55 50,42 Z"
        fill="#14F195" 
        opacity="0.9" />

  <!-- Tech crosshairs/ticks to reinforce Decentralized Hardware Terminal aesthetics -->
  <line x1="50" y1="5" x2="50" y2="12" stroke="#14F195" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="88" x2="50" y2="95" stroke="#9945FF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="10" y1="28" x2="16" y2="31" stroke="#9945FF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="90" y1="28" x2="84" y2="31" stroke="#14F195" stroke-width="1.5" stroke-linecap="round" />
</svg>
